<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315b50">
  <meta name="description" content="TeachMate V2 — a local-first workspace for ESL students, changing group classes, attendance, progress and teaching reports.">
  <title>TeachMate V2 — ESL Teacher Workspace</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" aria-label="TeachMate home"><span class="brand-mark">T</span><span><strong>TeachMate</strong><small>ESL teacher workspace · V2</small></span></a>
    <div class="nav-label">TEACHING</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-link active" data-page="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav-link" data-page="students">♙ <span>Students</span></button>
      <button class="nav-link" data-page="schedule">▦ <span>Schedule & classes</span></button>
      <button class="nav-link" data-page="lessons">▤ <span>Lessons & materials</span></button>
      <button class="nav-link" data-page="attendance">✓ <span>Attendance</span></button>
      <button class="nav-link" data-page="progress">↗ <span>Student progress</span></button>
      <button class="nav-link" data-page="tasks">☷ <span>Tasks & reminders</span></button>
    </nav>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav">
      <button class="nav-link" data-page="reports">▥ <span>Teaching reports</span></button>
      <button class="nav-link" data-page="tutorial">? <span>Tutorial</span></button>
      <button class="nav-link" data-page="backup">⇧ <span>Backup & settings</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="local-note"><span class="status-dot"></span><div><b>Stored on this device</b><small>No account or cloud sync</small></div></div>
      <div class="version">TEACHMATE V2.0 · LOCAL-FIRST</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
      <div><p class="eyebrow" id="todayLabel">YOUR TEACHING SPACE</p><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-actions"><span class="offline-pill"><span class="status-dot"></span><span id="connectionLabel">Offline-ready</span></span><div class="avatar">T</div></div>
    </header>
    <section class="page-content" id="pageContent" aria-live="polite"></section>
    <footer class="footer">TeachMate V2 · Private browser-based workspace · Export backups regularly</footer>
  </main>
</div>
<dialog id="recordDialog" class="modal">
  <form id="recordForm">
    <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">RECORD</p><h2 id="modalTitle">Add record</h2></div><button type="button" class="icon-btn" id="closeModal" aria-label="Close">×</button></div>
    <div id="modalFields" class="form-grid"></div>
    <p class="form-hint" id="modalHint"></p>
    <div class="modal-actions"><button type="button" class="btn btn-quiet" id="cancelModal">Cancel</button><button type="submit" class="btn btn-primary">Save record</button></div>
  </form>
</dialog>
<input type="file" id="restoreInput" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body></html>
